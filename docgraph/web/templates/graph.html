{% extends "base.html" %}
{% set active = 'graph' %}
{% block title %}关系图 · DocGraph{% endblock %}
{% block content %}
<h1>关系图</h1>

<form class="filter-bar" id="graph-controls">
  <label>kinds:
    <input type="text" name="kinds" value="register,bitfield,module,interface,signal,figure" placeholder="register,bitfield,module,interface,signal,figure,…">
  </label>
  <label>edge_kinds:
    <input type="text" name="edge_kinds" value="has_bitfield,connects_to,controls,illustrated_by,references" placeholder="(空=全部)">
  </label>
  <label>limit:
    <input type="number" name="limit" value="200" min="10" max="2000">
  </label>
  <button type="submit">刷新</button>
</form>

<div id="graph-status" class="muted">加载中…</div>
<svg id="graph" width="100%" height="700"></svg>

<div class="legend">
  <span class="dot dot-register"></span> register
  <span class="dot dot-bitfield"></span> bitfield
  <span class="dot dot-section"></span> section
  <span class="dot dot-pin"></span> pin
  <span class="dot dot-parameter"></span> parameter
  <span class="dot dot-module"></span> module
  <span class="dot dot-signal"></span> signal
  <span class="dot dot-interface"></span> interface
  <span class="dot dot-figure"></span> figure
  <span class="dot dot-term"></span> term
</div>

{% endblock %}
{% block scripts %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const KIND_COLORS = {
  register: '#5b8def', bitfield: '#92c5fd',
  section:  '#9c8df0', pin:      '#f59e0b',
  parameter:'#10b981', figure:   '#ec4899',
  term:     '#64748b', module:   '#a78bfa',
  signal:   '#fb7185', chunk:    '#cbd5e1', document: '#0ea5e9',
};

let simulation = null;

function fetchGraph() {
  const form = new FormData(document.getElementById('graph-controls'));
  const params = new URLSearchParams();
  for (const [k, v] of form.entries()) {
    if (v) params.set(k, v);
  }
  document.getElementById('graph-status').textContent = '加载中…';
  return fetch('/api/graph?' + params.toString()).then(r => r.json());
}

function render(data) {
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();
  const width = svg.node().clientWidth;
  const height = +svg.attr('height');

  const status = document.getElementById('graph-status');
  status.textContent = `${data.nodes.length} 节点 · ${data.edges.length} 边`;
  if (!data.nodes.length) {
    status.textContent += '（空图。先 docgraph build 或调整过滤器）';
    return;
  }

  // 准备 d3 数据
  const nodeIdx = new Map(data.nodes.map(n => [n.id, n]));
  const links = data.edges.map(e => ({
    source: e.src, target: e.dst,
    kind: e.kind, confidence: e.confidence,
  })).filter(l => nodeIdx.has(l.source) && nodeIdx.has(l.target));

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.2, 4])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  const link = g.append('g').attr('stroke', '#cbd5e1').attr('stroke-opacity', 0.7)
    .selectAll('line').data(links).join('line').attr('stroke-width', 1);

  const node = g.append('g')
    .selectAll('g').data(data.nodes).join('g')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => d.kind === 'register' ? 8 : d.kind === 'section' ? 5 : 4)
    .attr('fill', d => KIND_COLORS[d.kind] || '#9ca3af')
    .attr('stroke', '#fff').attr('stroke-width', 1.2);
  node.append('title').text(d => `${d.kind}: ${d.name}\n${d.id}`);
  node.append('text')
    .attr('dx', 10).attr('dy', '0.32em')
    .style('font-size', '10px').style('pointer-events', 'none')
    .text(d => d.name);
  node.on('click', (e, d) => {
    if (d.kind === 'register') {
      window.location = '/registers/' + encodeURIComponent(d.id);
    } else {
      window.location = '/search?q=' + encodeURIComponent(d.name);
    }
  });

  simulation = d3.forceSimulation(data.nodes)
    .force('charge', d3.forceManyBody().strength(-80))
    .force('link', d3.forceLink(links).id(d => d.id).distance(50))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide(14))
    .on('tick', () => {
      link
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
}

document.getElementById('graph-controls').addEventListener('submit', e => {
  e.preventDefault();
  fetchGraph().then(render);
});

fetchGraph().then(render);
</script>
{% endblock %}
