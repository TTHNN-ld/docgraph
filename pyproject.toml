[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgraph-core"
version = "0.1.0"
description = "Document Knowledge Graph engine for chip specs — like codegraph for docs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "DocGraph Contributors" }]
keywords = ["chip", "spec", "knowledge-graph", "pdf", "mcp", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]

dependencies = [
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "structlog>=24.1",
  "pymupdf>=1.24",
  "watchdog>=4.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34", "openai>=1.40"]
marker = ["marker-pdf>=1.0"]
mineru = ["mineru>=3,<4"]
docling = ["docling>=2.0"]
mcp = ["mcp>=1.0"]
documents = ["markdown-it-py>=3.0", "openpyxl>=3.1", "python-docx>=1.1"]
embeddings = ["sentence-transformers>=3.0"]
lancedb = ["lancedb>=0.16"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]
all = ["docgraph-core[llm,docling,mineru,marker,mcp,documents,embeddings,lancedb,web]"]

[project.scripts]
docgraph = "docgraph.cli.main:app"

[project.entry-points."docgraph.parsers"]
pymupdf  = "docgraph.parsers.pymupdf_parser:PyMuPDFParser"
docling  = "docgraph.parsers.docling_parser:DoclingParser"
mineru   = "docgraph.parsers.mineru_parser:MinerUParser"
marker   = "docgraph.parsers.marker_parser:MarkerParser"
docx     = "docgraph.parsers.docx_parser:DocxParser"
markdown = "docgraph.parsers.markdown_parser:MarkdownParser"
xlsx     = "docgraph.parsers.xlsx_parser:XlsxParser"

[project.entry-points."docgraph.extractors"]
section      = "docgraph.extractors.section:SectionExtractor"
table_entity = "docgraph.extractors.table_entity:TableEntityExtractor"
glossary     = "docgraph.extractors.glossary:GlossaryExtractor"
figure       = "docgraph.extractors.figure:FigureExtractor"

[project.entry-points."docgraph.embeddings"]
hash   = "docgraph.embeddings.hash_encoder:HashEncoder"
bge_m3 = "docgraph.embeddings.hash_encoder:BgeM3Encoder"

[project.entry-points."docgraph.stores"]
sqlite = "docgraph.graph.sqlite_store:SQLiteGraphStore"

[project.entry-points."docgraph.llm"]
anthropic     = "docgraph.llm.client:AnthropicProvider"
openai_compat = "docgraph.llm.client:OpenAICompatProvider"

[tool.hatch.build.targets.wheel]
packages = ["docgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# Chinese prose and Typer's declarative parameter API intentionally use
# full-width punctuation and function-call defaults.
ignore = [
  "E501", "B008", "RUF001", "RUF002", "RUF003",
  # Parser/extractor capabilities are intentional immutable-by-convention
  # class metadata; changing public string enums is not a lint migration.
  "RUF005", "RUF012", "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
