name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough info to reproduce.

  - type: input
    id: version
    attributes:
      label: DocGraph version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.1"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: A clear description.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. `docgraph init`
        2. `docgraph build`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Relevant config / spec characteristics
      placeholder: PDF size, language, parser used, ...
