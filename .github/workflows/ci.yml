name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.3'

      - name: Sync locked environment
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run pytest tests/ -v --cov=docgraph --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.3'
      - run: uv sync --locked --group dev
      - run: uv run ruff check docgraph/
      - run: uv run ruff format --check docgraph/
      - name: Run mypy
        run: uv run mypy docgraph/

  smoke-build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.3'
      - name: Sync locked environment
        run: uv sync --locked
      - name: Verify CLI runs
        run: |
          uv run docgraph version
          uv run docgraph admin plugins ls
          uv run docgraph init --family ci-test
          uv run docgraph status
          uv run docgraph admin migrate
